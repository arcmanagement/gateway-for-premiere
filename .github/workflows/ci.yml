name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:dist
      - run: npm run verify:package

  macos-installer:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:installer
      - run: npm run verify:installer

  windows-installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: choco install innosetup --yes --no-progress
      - run: npm run build:installer:windows
      - run: npm run verify:installer:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/Gateway-for-Premiere-*-Windows.exe
            release/Gateway-for-Premiere-*-Windows.exe.sha256
          if-no-files-found: error
          retention-days: 7
